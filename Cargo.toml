[package]
name = "frame-test"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = "29.0.3"
winit = { version = "0.30", features = ["rwh_06"] }
pollster = "0.4"
clap = { version = "4.5", features = ["derive"] }
bytemuck = { version = "1.15", features = ["derive"] }
drm = "0.15.0"
drm-sys = "0.8.1"
libc = "0.2.183"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client"] }

[dev-dependencies]
serde_json = "1"
